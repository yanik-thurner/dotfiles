unbind C-b
set -g prefix C-Space
bind C-Space send-prefix

set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'christoomey/vim-tmux-navigator'

set -g set-clipboard on

# Disable arrow pane navigation
unbind Up
unbind Down
unbind Left
unbind Right
# Disable arrow pane resize
unbind C-Up
unbind C-Down
unbind C-Left
unbind C-Right

# Layout Undo
bind -r u select-layout -o

unbind [
bind-key [ run-shell "~/.config/tmux/nvim-copy-mode.sh"

# Dim inactive panes
set -g window-style bg=terminal,fg=brightblack
set -g window-active-style bg=terminal,fg=terminal
set -g pane-border-style fg=brightblack,bg=terminal
set -g pane-active-border-style fg=color6,bg=terminal
set -g pane-border-indicators colour
set -g pane-border-lines single
set -g pane-border-status top
set -g pane-border-format " #P: #{pane_current_command} "


# ------------------------- #
run "~/.config/tmux/plugins/tpm/tpm"

